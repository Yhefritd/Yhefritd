
name: Bomberman Contribution Graph

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Generate Bomberman SVG
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Yhefritd
          games: 'bomberman'

      - name: Publish Bomberman
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
